<meta name="description" content="جدار قمم التفاعلي: 15 موقعاً حياً تتحرك أمامك على شاشة منحنية.">

<meta property="og:title" content="قمم | جدار المعرض التفاعلي"><meta property="og:description" content="15 موقعاً حياً بهويات مختلفة تتحرك أمامك على شاشة منحنية.">

<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A24D;--gold2:#E8C877;--ink:#F4EFE4;--mute:#A79F92}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--ink);font-family:Tajawal,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.room{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:clamp(28px,5vw,64px) 16px 40px;overflow:hidden;
 background:radial-gradient(70% 45% at 50% 0%,rgba(201,162,77,.16),transparent 70%),radial-gradient(90% 60% at 50% 100%,rgba(201,162,77,.10),transparent 70%),linear-gradient(#050505,#000 60%,#070605)}
.room:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(201,162,77,.035) 0 1px,transparent 1px 120px);mask-image:linear-gradient(transparent,#000 40%,transparent);pointer-events:none}
.top{position:relative;text-align:center;z-index:2}
.top .k{font-family:Cinzel,serif;letter-spacing:.42em;font-size:13px;color:var(--gold)}
.top h1{margin:.35em 0 .2em;font-size:clamp(28px,4.6vw,58px);font-weight:800;line-height:1.35;background:linear-gradient(180deg,#fff,#E9DDC4 60%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;padding:.1em 0}
.top p{color:var(--mute);font-size:clamp(14px,1.5vw,18px)}
.stage{position:relative;width:100%;max-width:1500px;margin-top:clamp(22px,3vw,44px);perspective:1500px;perspective-origin:50% 45%}
.wall{position:relative;margin:0 auto;transform-style:preserve-3d;width:100%}
.col{position:absolute;top:0;display:flex;flex-direction:column;gap:var(--g,12px);transform-style:preserve-3d;padding:0 calc(var(--g,12px)/2)}
.tile{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#0b0b0b;cursor:pointer;transform-style:preserve-3d;
 box-shadow:0 0 0 1px rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.6);transition:box-shadow .5s,filter .5s,translate .5s}
.tile iframe{position:absolute;top:0;right:0;width:1280px;height:800px;border:0;transform-origin:top right;pointer-events:none;opacity:0;transition:opacity 1s}
.tile.ready iframe{opacity:1}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(201,162,77,.5);font-family:Cinzel,serif;letter-spacing:.3em;font-size:11px;background:radial-gradient(circle at 50% 40%,#16130c,#070707)}
.tile .ph:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(201,162,77,.08) 50%,transparent 70%);background-size:220% 100%;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-120% 0}}
.tile.ready .ph{opacity:0;transition:opacity .8s .2s}
.tile .lab{position:absolute;inset:auto 0 0 0;padding:18px 10px 7px;font-size:clamp(9px,.85vw,13px);font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;justify-content:space-between;align-items:center;opacity:.0;transition:opacity .4s}
.tile .lab i{font-style:normal;font-size:.8em;color:var(--gold2);display:flex;align-items:center;gap:5px}
.tile .lab i:before{content:"";width:6px;height:6px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84}
.tile:hover .lab,.tile.on .lab{opacity:1}
.tile:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.10),transparent 35%);mix-blend-mode:screen}
.tile.on,.tile:hover{box-shadow:0 0 0 2px var(--gold2),0 0 34px rgba(232,200,119,.45),0 18px 40px rgba(0,0,0,.7);translate:0 0 22px;z-index:3}
.cursor{position:absolute;top:0;left:0;width:26px;height:26px;z-index:20;pointer-events:none;transition:transform 1.1s cubic-bezier(.65,.05,.25,1);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.cursor .ring{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:2px solid var(--gold2);opacity:0;transform:scale(.4)}
.cursor.click .ring{animation:rg .6s ease-out}
@keyframes rg{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}
.floor{position:absolute;left:5%;right:5%;bottom:-70px;height:120px;background:radial-gradient(50% 50% at 50% 0%,rgba(201,162,77,.28),transparent 70%);filter:blur(14px);pointer-events:none}
.cta{position:relative;z-index:2;margin-top:clamp(40px,5vw,70px);display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cta a{padding:13px 26px;border-radius:999px;font-weight:700;font-size:15px}
.cta .p{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#140f05}
.cta .s{border:1px solid rgba(201,162,77,.5);color:var(--gold2)}
.hint{margin-top:14px;color:#6f685d;font-size:13px;text-align:center}
@media(max-width:820px){
 .stage{perspective:none;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}
 .wall{width:1040px!important;height:auto!important;display:flex;gap:0}
 .col{position:relative;left:auto!important;width:208px!important;transform:none!important}
 .cursor{display:none}
}
@media(prefers-reduced-motion:reduce){.cursor{display:none}}
</style>
</head>
<body>
<section class="room">
 <div class="top">
  <div class="k">QIMAM</div>
  <h1>معرض تصميم المواقع</h1>
  <p>15 موقعاً حياً بهويات مختلفة، تتحرك أمامك الآن. اضغط على أي شاشة لفتح الموقع.</p>
 </div>
 <div class="stage" id="stage">
  <div class="wall" id="wall"></div>
  <div class="cursor" id="cur"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M3 2l7.5 19 2.6-7.9L21 10.5z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="ring"></span></div>
  <div class="floor"></div>
 </div>
 <div class="cta"><a class="p" href="https://qimampro.github.io/#contact">اطلب موقعك</a><a class="s" href="index.html">المعرض التفصيلي</a><a class="s" href="https://qimampro.github.io/">موقع قمم</a></div>
 <div class="hint">على الجوال اسحب الجدار يميناً ويساراً</div>
</section>
<script>
const S=[['rawasheen','رواشين للعمارة'],['tuwaiq','طويق للذكاء الاصطناعي'],['asalah','أصالة للأزياء'],['darb_zubaidah','درب زبيدة'],['sufrah','سُفرة البلد'],
['sanad','مكتب سند للمحاماة'],['sudair','سدير للطاقة المتجددة'],['sadu_studio','ستوديو سدو'],['rawaa','رواء للتطوير العقاري'],['alriayah','مجمع الرعاية الصحية'],
['masar_alharamain','مسار الحرمين'],['nukhbat_alquwa','نخبة القوة'],['alrowad_cafe','كافي الرواد'],['kunooz','كنوز التراث الإسلامي'],['alataa','جمعية العطاء والنماء']];
const wall=document.getElementById('wall'),stage=document.getElementById('stage'),cur=document.getElementById('cur');
const cols=[...Array(5)].map(()=>{const c=document.createElement('div');c.className='col';wall.appendChild(c);return c;});
const tiles=S.map(([k,n],i)=>{const a=document.createElement('a');a.className='tile';a.href=k+'.html';a.target='_blank';a.rel='noopener';a.setAttribute('aria-label',n);
 a.innerHTML=`<div class="ph">QIMAM</div><div class="lab"><span>${n}</span><i>LIVE</i></div>`;cols[i%5].appendChild(a);return {el:a,k,i,y:0,dir:1,speed:.35+((i*37)%10)/40,pause:0,win:null,max:0};});
// curved wall: cylinder bending toward viewer at the edges
const flat=()=>matchMedia('(max-width:820px)').matches;
function curve(){const W=Math.min(stage.clientWidth,1360);if(flat()){wall.style.height='';fit();return;}
 const g=Math.max(6,Math.round(W*.009)),w=(W-20)/5*0.93,Rr=w*3.1,th=(w)/Rr*180/Math.PI;
 cols.forEach((c,k)=>{c.style.setProperty('--g',g+'px');c.style.width=w+'px';c.style.left=`calc(50% - ${w/2}px)`;c.style.transformOrigin=`50% 50% ${Rr}px`;c.style.transform=`rotateY(${(k-2)*-th}deg)`;});
 requestAnimationFrame(()=>{fit();wall.style.height=cols[0].offsetHeight+'px';});}
function fit(){tiles.forEach(t=>{const f=t.el.querySelector('iframe');if(f)f.style.transform=`scale(${t.el.clientWidth/1280})`;});}
addEventListener('resize',curve);curve();
// staggered lazy loading of the live sites
let loaded=0;function load(t){const f=document.createElement('iframe');f.src=t.k+'.html';f.loading='lazy';f.tabIndex=-1;f.setAttribute('aria-hidden','true');f.title=t.k;
 f.onload=()=>{try{t.win=f.contentWindow;const d=t.win.document;d.documentElement.style.scrollBehavior='auto';t.max=Math.max(0,d.documentElement.scrollHeight-800);}catch(e){}t.el.classList.add('ready');};
 t.el.prepend(f);fit();}
const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();tiles.forEach((t,i)=>setTimeout(()=>load(t),i*260));}},{rootMargin:'200px'});io.observe(wall);
// auto scrolling inside each screen
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let last=performance.now();
function tick(now){const dt=Math.min(64,now-last);last=now;if(!reduce)tiles.forEach(t=>{if(!t.win||!t.max)return;if(t.pause>0){t.pause-=dt;return;}
 const sp=(t.el.classList.contains('on')||t.hover?2.6:1)*t.speed*dt;t.y+=sp*t.dir;
 if(t.y>=t.max){t.y=t.max;t.dir=-1;t.pause=1400;}else if(t.y<=0){t.y=0;t.dir=1;t.pause=1800;}
 try{t.win.scrollTo(0,t.y);}catch(e){}});requestAnimationFrame(tick);}requestAnimationFrame(tick);
tiles.forEach(t=>{t.el.addEventListener('mouseenter',()=>t.hover=1);t.el.addEventListener('mouseleave',()=>t.hover=0);});
// guided cursor that "visits" screens
let ci=1;function move(){if(flat()||reduce)return setTimeout(move,3000);const t=tiles[ci],sr=stage.getBoundingClientRect(),r=t.el.getBoundingClientRect();
 const x=r.left-sr.left+r.width*(.35+Math.random()*.3),y=r.top-sr.top+r.height*(.35+Math.random()*.3);cur.style.transform=`translate(${x}px,${y}px)`;
 setTimeout(()=>{tiles.forEach(o=>o.el.classList.remove('on'));t.el.classList.add('on');cur.classList.remove('click');void cur.offsetWidth;cur.classList.add('click');},1150);
 let n;do{n=Math.floor(Math.random()*15)}while(n===ci);ci=n;setTimeout(move,3600);}
setTimeout(move,1800);
</script>
</body>
