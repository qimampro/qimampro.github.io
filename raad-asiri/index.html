var CV_CSS=":where(#cvStage),:where(#cvStage) *{box-sizing:border-box}\n:where(#cvStage) :where(h1,h2,h3,h4,p,ul,ol,li,figure,blockquote,dl,dd){margin:0;padding:0}\n#cvStage{--ink:#0A1E26;--ink2:#33484D;--mut:#6A7E82;--gold:#B9924F;--gold-lt:#D2B278;--sea:#1E6F68;--sea-lt:#E8F1EF;--rule:#E1E7E7;--sand:#F8F3E9;\n  font-family:'Cairo',system-ui,-apple-system,sans-serif;color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}\n#cvStage ul,#cvStage ol{list-style:none}\n#cvStage .mk svg,#cvStage .fm svg,#cvStage .full svg{width:100%;height:auto;display:block}\n#cvStage b,#cvStage strong{font-weight:700}\n\n.sheet{position:relative;width:210mm;height:297mm;background:#fff;overflow:hidden;\n  -webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}\n.sheet+.sheet{margin-top:8mm}\n.sheet::before{content:\"\";position:absolute;top:0;inset-inline-start:0;width:100%;height:4.5mm;\n  background:linear-gradient(90deg,var(--gold) 0%,var(--gold-lt) 42%,var(--sea) 100%)}\n.sheet-in{position:absolute;inset:11mm 13mm 13mm 13mm}\n.flow{width:100%;transform-origin:top left}\n[dir=\"rtl\"] .flow{transform-origin:top right}\n.sheet-ft{position:absolute;inset-inline:13mm;bottom:6mm;display:flex;align-items:center;gap:8px;\n  font-size:10.08pt;color:var(--mut);border-top:1px solid var(--rule);padding-top:2.2mm}\n.sheet-ft .fm{width:17px;color:var(--gold);flex:0 0 auto;display:block}\n.sheet-ft .fn{margin-inline-start:auto;font-weight:700;color:var(--gold)}\n\n/* ---- masthead (page 1) ---- */\n.cvhead{display:flex;align-items:center;gap:6mm;padding-bottom:4mm;border-bottom:2px solid var(--gold)}\n.cvhead .ph{width:26mm;height:26mm;border-radius:5mm;object-fit:cover;flex:0 0 auto;background:#0A1E26}\n.cvhead .id{flex:1;min-width:0}\n.cvhead h1{font-size:30pt;font-weight:800;line-height:1.26;letter-spacing:-.01em}\n.cvhead .rl{font-size:13.92pt;font-weight:700;color:var(--gold);margin-top:1.1mm}\n.cvhead .sm{font-size:11.04pt;color:var(--mut);margin-top:1.4mm <style>:root{
  --ink:#05141A; --ink2:#0A2129; --ink3:#0E2B35;
  --sea:#2E8F86; --sea-lt:#8FD8CF;
  --gold:#D2B278; --gold-lt:#E7CE96; --gold-dk:#B9924F;
  --fog:#DCE6E7; --soft:#9FB3B6; --cream:#F2F6F6;
  --line:rgba(220,230,231,.12);
  --ease:cubic-bezier(.22,.7,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--ink);-webkit-text-size-adjust:100%}
body{background:var(--ink);color:#F4F8F8;font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.85;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
img,svg{display:block;max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,44px)}
.sect{padding-block:clamp(56px,7vw,104px)}

/* ---------- eyebrow + headings ---------- */
.eyebrow{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--gold);margin-bottom:18px}
.eyebrow::before{content:"";width:26px;height:1px;background:currentColor;flex:0 0 auto}
.pipe{color:var(--sea-lt);font-weight:800;padding-inline:5px;display:inline-block;font-size:.95em;transform:translateY(-1px)}
.h2{font-size:clamp(27px,4.2vw,48px);font-weight:800;line-height:1.18;letter-spacing:-.01em;margin:0}
.lead{color:var(--soft);font-size:16px;max-width:62ch;margin-top:12px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:70;background:rgba(5,20,26,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:11px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:54px;color:var(--gold);flex:0 0 auto;display:flex;align-items:center}
.brand .mark svg{width:100%;height:auto}
.brand b{font-size:16px;font-weight:700;display:block;line-height:1.3}
.brand small{font-size:11.5px;letter-spacing:.04em;color:var(--soft);display:block}
nav.links{display:flex;flex-wrap:wrap;gap:clamp(10px,2vw,26px);margin-inline-start:auto;font-size:14px;font-weight:500;color:var(--fog)}
nav.links a{opacity:.82;transition:color .18s var(--ease),opacity .18s var(--ease)}
nav.links a:hover,nav.links a:focus-visible{opacity:1;color:var(--gold)}
.hact{display:flex;align-items:center;gap:9px}
.pill{font-size:13px;font-weight:600;padding:9px 15px;border-radius:999px;border:1px solid rgba(220,230,231,.26);transition:border-color .18s var(--ease),color .18s var(--ease),background .18s var(--ease)}
.pill:hover{border-color:var(--gold);color:var(--gold)}
.solid{background:var(--gold);color:var(--ink);font-weight:700;border-color:transparent}
.solid:hover{background:var(--gold-lt);color:var(--ink);border-color:transparent}

/* ---------- CV menu ---------- */
.cvwrap{position:relative}
.cvbtn{display:inline-flex;align-items:center;gap:7px}
.cvbtn svg{width:16px;height:16px}
.cvbtn .caret{width:11px;height:11px;opacity:.7;transition:transform .2s var(--ease)}
.cvbtn[aria-expanded="true"]{border-color:var(--gold);color:var(--gold)}
.cvbtn[aria-expanded="true"] .caret{transform:rotate(180deg)}
.cvmenu{position:absolute;top:calc(100% + 10px);inset-inline-end:0;min-width:284px;background:#0C2530;border:1px solid rgba(220,230,231,.16);border-radius:18px;padding:7px;box-shadow:0 26px 60px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(-6px);transition:all .18s var(--ease);z-index:90}
.cvmenu.open{opacity:1;visibility:visible;transform:none}
.cvmenu .grp{padding:9px 13px 5px;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--gold);display:flex;align-items:center;gap:7px}
.cvmenu .grp i{flex:1;height:1px;background:rgba(210,178,120,.28)}
.cvmenu button{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:start;padding:10px 13px;border-radius:12px;font-size:13.5px;font-weight:600;transition:background .15s var(--ease),color .15s var(--ease)}
.cvmenu button:hover,.cvmenu button:focus-visible{background:rgba(46,143,134,.18);color:var(--sea-lt)}
.cvmenu button svg{width:17px;height:17px;flex:0 0 auto;color:var(--gold);margin-top:3px}
.cvmenu button small{display:block;font-weight:400;font-size:11.5px;color:var(--soft);line-height:1.5;margin-top:1px}
.cvmenu .sep{height:1px;background:var(--line);margin:5px 8px}
.scrim{position:fixed;inset:0;z-index:80;display:none}
.scrim.on{display:block}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(110% 80% at 85% 8%,rgba(46,143,134,.16),transparent 55%),radial-gradient(70% 60% at 8% 92%,rgba(210,178,120,.08),transparent 60%);pointer-events:none}
.herogrid{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(28px,5vw,60px);align-items:center;padding-block:clamp(36px,6vw,76px) clamp(44px,6vw,80px)}
.herotext{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.badge{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;background:rgba(46,143,134,.16);border:1px solid rgba(46,143,134,.42);color:var(--sea-lt)}
.badge i{width:7px;height:7px;border-radius:50%;background:#5FD3C4;box-shadow:0 0 12px #5FD3C4}
h1{font-size:clamp(40px,7.2vw,80px);font-weight:800;line-height:1.06;letter-spacing:-.02em}
.role{font-size:clamp(16px,2.1vw,24px);font-weight:600;color:var(--gold);line-height:1.45}
.lede{max-width:54ch;font-size:clamp(15px,1.5vw,17px);color:var(--fog);opacity:.92}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.cta a,.cta button{padding:14px 28px;border-radius:999px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:9px;transition:all .18s var(--ease)}
.cta .solid{box-shadow:0 14px 34px rgba(210,178,120,.24)}
.cta .ghost{border:1px solid rgba(220,230,231,.3)}
.cta .ghost:hover{border-color:#F4F8F8;background:rgba(244,248,248,.06)}
.cta svg{width:18px;height:18px}
.portrait{position:relative;border-radius:30px;overflow:hidden;background:linear-gradient(160deg,rgba(46,143,134,.24),rgba(5,20,26,.6));box-shadow:0 40px 90px rgba(0,0,0,.5);border:1px solid var(--line);min-height:min(74vh,540px);display:flex;align-items:flex-end}
.portrait img{width:100%;height:100%;min-height:min(74vh,540px);object-fit:cover;object-position:50% 14%;filter:saturate(1.04) contrast(1.02)}
.portrait .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,20,26,.88) 0%,rgba(5,20,26,.1) 46%,transparent 70%)}
.portrait .cap{position:absolute;inset-inline:0;bottom:0;padding:24px clamp(20px,3vw,30px);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline}
.portrait .cap b{font-size:19px;font-weight:700}
.portrait .cap span{font-size:13.5px;color:var(--gold)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;padding-bottom:clamp(40px,5vw,66px)}
.stat{padding:22px 24px;border-radius:20px;background:rgba(244,248,248,.045);border:1px solid rgba(220,230,231,.1)}
.stat .n{font-size:clamp(28px,3.4vw,40px);font-weight:800;line-height:1;color:var(--gold)}
.stat .t{font-size:13.5px;color:var(--fog);opacity:.85;margin-top:9px;line-height:1.55}

/* ---------- about ---------- */
#about{background:var(--ink2)}
.aboutgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(26px,4vw,54px);margin-top:34px}
.aboutgrid p{font-size:16px;color:var(--fog);opacity:.92;margin-bottom:18px}
.glance{padding:clamp(22px,3vw,32px);border-radius:24px;background:linear-gradient(160deg,rgba(46,143,134,.14),rgba(244,248,248,.03));border:1px solid var(--line)}
.glance h3{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:6px}
.grow{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:baseline}
.grow dt{font-size:12.5px;color:var(--soft);white-space:nowrap}
.grow dd{font-size:15px;color:var(--fog);font-weight:600}

/* ---------- experience ---------- */
.explist{display:flex;flex-direction:column;gap:18px;margin-top:38px}
.expcard{padding:clamp(22px,3.2vw,36px);border-radius:26px;background:rgba(244,248,248,.04);border:1px solid var(--line);transition:border-color .2s var(--ease),background .2s var(--ease)}
.expcard:hover{border-color:rgba(210,178,120,.4);background:rgba(244,248,248,.06)}
.exphead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;margin-bottom:12px}
.exphead h3{font-size:clamp(19px,2.3vw,26px);font-weight:700;line-height:1.3}
.tag{font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(46,143,134,.18);border:1px solid rgba(46,143,134,.45);color:var(--sea-lt)}
.date{margin-inline-start:auto;font-size:14px;font-weight:600;color:var(--gold)}
.co{font-size:15.5px;font-weight:600;color:var(--fog);margin-bottom:8px}
.report{font-size:15.5px;color:var(--fog);opacity:.85;max-width:72ch;margin-bottom:20px}
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px}
.point{padding:17px 19px;border-radius:18px;background:rgba(5,20,26,.55);border:1px solid rgba(220,230,231,.08)}
.point b{display:block;font-size:14.5px;font-weight:700;color:var(--gold);margin-bottom:5px}
.point span{font-size:14px;color:var(--fog);opacity:.85;line-height:1.7}

/* ---------- skills (light) ---------- */
#skills{background:var(--cream);color:var(--ink)}
#skills .eyebrow{color:#1E6F68}
#skills .lead{color:#3F5A5C}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(18px,2.6vw,28px);margin-top:36px}
.skillcard{padding:clamp(22px,3vw,32px);border-radius:24px;background:#fff;border:1px solid rgba(5,20,26,.09);box-shadow:0 18px 44px rgba(5,20,26,.06)}
.skillcard h3{font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:9px}
.skillcard h3 svg{width:19px;height:19px;color:#1E6F68;flex:0 0 auto}
.skillcard .note{font-size:12.5px;color:#5A7375;margin:6px 0 16px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13.5px;font-weight:500;padding:7px 14px;border-radius:999px;background:#EAF1F0;color:#0C3A38;border:1px solid rgba(30,111,104,.16)}
.chip.sand{background:#F6EEDF;color:#6B5124;border-color:rgba(185,146,79,.24)}

/* ---------- credentials ---------- */
#credentials{background:var(--ink2)}
.credtop{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:36px}
.credhero{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:22px;align-items:center;padding:clamp(24px,3.2vw,36px);border-radius:26px;background:linear-gradient(150deg,rgba(210,178,120,.22),rgba(46,143,134,.09));border:1px solid rgba(210,178,120,.36)}
.credhero .seal{width:96px;height:96px;flex:0 0 auto;border-radius:50%;border:2px solid rgba(210,178,120,.6);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--gold);letter-spacing:-.01em;background:rgba(5,20,26,.35);line-height:1;white-space:nowrap;direction:ltr;text-align:center}
.credhero .seal sup{font-size:8.5px;font-weight:700;line-height:1;vertical-align:super;margin-inline-start:1.5px}
.credhero .body{flex:1;min-width:240px}
.credhero .kind{font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--sea-lt);margin-bottom:5px}
.credhero h3{font-size:clamp(19px,2.2vw,24px);font-weight:800;line-height:1.35}
.credhero .meta{font-size:14px;color:var(--gold);font-weight:600;margin-top:4px}
.credhero p{font-size:14.5px;color:var(--fog);opacity:.88;margin-top:9px;max-width:62ch}
.credcard{padding:clamp(20px,2.8vw,28px);border-radius:22px;background:rgba(244,248,248,.04);border:1px solid rgba(220,230,231,.11)}
.credcard h3{font-size:15px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:9px}
.credcard h3 svg{width:18px;height:18px;flex:0 0 auto}
.credcard .note{font-size:12.5px;color:var(--soft);margin:6px 0 14px;line-height:1.6}
.credcard li{list-style:none;display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--fog)}
.credcard li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sea);margin-top:11px;flex:0 0 auto}
.credcard li b{font-weight:700;color:#F4F8F8}
.credcard li i{display:block;font-style:normal;font-size:12.5px;color:var(--soft)}

/* ---------- contact ---------- */
#contact{position:relative;overflow:hidden}
#contact::before{content:"";position:absolute;inset:0;background:radial-gradient(85% 70% at 20% -5%,rgba(46,143,134,.14),transparent 55%),radial-gradient(65% 60% at 92% 105%,rgba(210,178,120,.09),transparent 58%);pointer-events:none}
#contact .wrap{position:relative}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px;margin-top:38px}
.ccard{padding:24px;border-radius:22px;background:rgba(244,248,248,.05);border:1px solid var(--line);display:flex;align-items:flex-start;gap:13px;transition:border-color .2s var(--ease),background .2s var(--ease)}
.ccard:hover{border-color:var(--gold);background:rgba(244,248,248,.08)}
.ccard svg{width:21px;height:21px;color:var(--gold);margin-top:2px;flex:0 0 auto}
.ccard .lb{font-size:13px;color:var(--soft);display:block}
.ccard b{font-size:16.5px;font-weight:700;direction:ltr;display:block;margin-top:6px;word-break:break-word}
.ccard.wa{background:linear-gradient(150deg,rgba(46,143,134,.32),rgba(46,143,134,.13));border-color:rgba(46,143,134,.5)}
.ccard.wa svg{color:var(--sea-lt)}
.ccard.wa:hover{border-color:#5FD3C4}
.ccard.wa b{direction:inherit}
.cvrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:32px}
.cvrow button{padding:14px 26px!important;display:inline-flex;align-items:center;gap:9px;white-space:nowrap;font-size:14.5px}
.cvrow button svg{width:18px;height:18px;flex:0 0 auto}
.cvbtn .caret svg{width:100%;height:100%}
.cvrow .loc{font-size:14px;color:var(--soft)}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);position:relative}
.foot{display:flex;flex-direction:column;align-items:center;gap:15px;text-align:center;padding-block:48px 30px}
.foot .full{width:min(280px,68vw);color:var(--gold);filter:drop-shadow(0 8px 22px rgba(210,178,120,.18))}
.foot .full svg{width:100%;height:auto}
.foot .t{font-size:14px;color:var(--soft)}
.foot .c{font-size:12.5px;color:#6C8285}

/* ---------- progress / share modal ---------- */
.mscrim{position:fixed;inset:0;z-index:120;background:rgba(3,12,16,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .2s var(--ease),visibility .2s var(--ease)}
.mscrim.open{opacity:1;visibility:visible}
.modal{width:min(390px,100%);background:#0C2530;border:1px solid rgba(220,230,231,.15);border-radius:24px;padding:28px 24px 22px;text-align:center;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.modal h4{font-size:17px;font-weight:700;margin-bottom:5px}
.modal p.sub{color:var(--soft);font-size:13px;margin-bottom:18px}
.ring{width:62px;height:62px;margin:2px auto 15px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bg{stroke:rgba(220,230,231,.14)}
.ring .fg{stroke:var(--gold);transition:stroke-dashoffset .3s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--gold)}
.step{color:var(--soft);font-size:13px;min-height:1.3em}
.doneic{width:56px;height:56px;margin:0 auto 13px;border-radius:50%;display:grid;place-items:center;background:rgba(46,143,134,.2);color:var(--sea-lt)}
.doneic svg{width:27px;height:27px}
.sharegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:15px 8px;border-radius:16px;border:1px solid rgba(220,230,231,.16);font-size:12.5px;font-weight:600;transition:all .18s var(--ease)}
.sbtn svg{width:21px;height:21px;color:var(--gold)}
.sbtn:hover{border-color:var(--gold);background:rgba(210,178,120,.1);color:var(--gold)}
.sbtn.wa svg{color:#25D366}
.sbtn.wa:hover{border-color:#25D366;background:rgba(37,211,102,.1);color:#F4F8F8}
.mclose{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(220,230,231,.16);font-size:13.5px;font-weight:600;color:var(--soft);transition:all .18s var(--ease)}
.mclose:hover{background:rgba(244,248,248,.06);color:#F4F8F8}
.toast{position:fixed;inset-inline:0;bottom:26px;margin:0 auto;width:max-content;max-width:88vw;z-index:130;background:#0C2530;border:1px solid rgba(210,178,120,.4);color:#F4F8F8;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:999px;box-shadow:0 20px 46px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(10px);transition:all .22s var(--ease)}
.toast.open{opacity:1;visibility:visible;transform:none}

/* offscreen CV render stage */
#cvStage{position:absolute;top:0;left:-99999px;width:210mm;z-index:-1;pointer-events:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body>*:not(#cvStage){display:none!important}}
@media (max-width:640px){
  nav.links{display:none}
  .hbar{gap:10px}
  .brand .mark{width:46px}
  .portrait,.portrait img{min-height:56vh}
}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">

      <span class="mark" id="brandMark" aria-hidden="true"></span>

        <b id="brandName"></b>
        <small id="brandRole"></small>
      </span>
    </a>
    <nav class="links" id="navLinks" aria-label="nav"></nav>

        </button>
        <div class="cvmenu" id="cvMenu" role="menu"></div>

      <a class="pill solid" id="navContact" href="#contact"></a>

  </div>
</header>

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pipeHTML(h){ return String(h).replace(/ \/ /g,' \u2014 ').replace(/\u2014/g,'<span class="pipe">|<\/span>'); }
function pipeify(root){
  if(!root) return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false), t, list=[];
  while((t=w.nextNode())){ var pn=t.parentNode&&t.parentNode.nodeName;
    if(pn!=='SCRIPT'&&pn!=='STYLE'&&/ \/ /.test(t.nodeValue)) t.nodeValue=t.nodeValue.replace(/ \/ /g,' \u2014 ');
    if(pn==='SCRIPT'||pn==='STYLE'||pn==='NOSCRIPT') continue;
    if(t.nodeValue.indexOf('\u2014')>-1) list.push(t); }
  list.forEach(function(node){
    var parts=node.nodeValue.split('\u2014'), frag=document.createDocumentFragment();
    parts.forEach(function(p,i){
      if(i){ var sp=document.createElement('span'); sp.className='pipe'; sp.textContent='|'; frag.appendChild(sp); }
      if(p) frag.appendChild(document.createTextNode(p));
    });
    node.parentNode.replaceChild(frag,node);
  });
}

/* shrink a sheet's content if it ever runs past the page edge */
function autofit(root){
  var sheets = root.querySelectorAll('.sheet-in');
  for(var i=0;i<sheets.length;i++){
    var inn = sheets[i], flow = inn.firstElementChild;
    var avail = inn.clientHeight, lo = .62, hi = 1.12, best = .62, mid, it;
    /* the visual height grows with the factor, so bisect for the largest
       factor that still fits: it shrinks an overlong page and stretches a
       short one, so both sheets end up full. */
    for(it=0; it<9; it++){
      mid = (lo+hi)/2;
      flow.style.transform = 'scale('+mid+')';
      flow.style.width = (100/mid)+'%';
      if(flow.scrollHeight*mid <= avail){ best = mid; lo = mid; } else { hi = mid; }
    }
    flow.style.transform = 'scale('+best+')';
    flow.style.width = (100/best)+'%';
  }
}

/* ---------- sheet -> canvas ------------------------------------------
   The sheet is wrapped in an SVG <foreignObject> together with the CV
   stylesheet (fonts included as data URIs) and handed to the browser's
   own renderer, so the bitmap is exactly what the page looks like:
   correct Arabic shaping, correct wrapping, no third-party text engine.
   html2canvas stays as a fallback for browsers that refuse to draw
   foreignObject images. */
function sheetSVG(sheet, doc, w, h){
  var css = '';
  var st = doc.querySelectorAll('style');
  for(var i=0;i<st.length;i++) css += st[i].textContent;
  css += '.sheet{box-shadow:none!important;margin:0!important}';
  var dir = doc.documentElement.getAttribute('dir') || 'rtl';
  var xml = new XMLSerializer().serializeToString(sheet);
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'
    + '<foreignObject x="0" y="0" width="'+w+'" height="'+h+'">'
    + '<div xmlns="http://www.w3.org/1999/xhtml" dir="'+dir+'" id="cvStage" '
    +   'style="width:'+w+'px;height:'+h+'px;background:#fff">'
    + '<style type="text/css">/*<![CDATA[*/'+css+'/*]]>*/</style>'
    + xml
    + '</div></foreignObject></svg>';
}

function canvasHasInk(cv){
  try{
    var g = cv.getContext('2d');
    var pts = [[.5,.06],[.5,.2],[.5,.45],[.5,.7],[.25,.3],[.75,.55]];
    for(var i=0;i<pts.length;i++){
      var d = g.getImageData(Math.round(cv.width*pts[i][0]), Math.round(cv.height*pts[i][1]), 24, 24).data;
      for(var j=0;j<d.length;j+=4){ if(d[j]<235||d[j+1]<235||d[j+2]<235) return true; }
    }
  }catch(e){ return false; }
  return false;
}

function sheetToCanvasSVG(sheet, doc, scale){
  return new Promise(function(resolve, reject){
    var r = sheet.getBoundingClientRect();
    var w = Math.round(r.width), h = Math.round(r.height);
    var url;
    try{ url = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sheetSVG(sheet, doc, w, h)); }
    catch(e){ reject(e); return; }
    var img = new Image();
    var to = setTimeout(function(){ reject(new Error('svg timeout')); }, 20000);
    img.onload = function(){
      clearTimeout(to);
      try{
        var cv = document.createElement('canvas');
        cv.width = Math.round(w*scale); cv.height = Math.round(h*scale);
        var g = cv.getContext('2d');
        g.fillStyle = '#ffffff'; g.fillRect(0,0,cv.width,cv.height);
        g.drawImage(img, 0, 0, cv.width, cv.height);
        if(!canvasHasInk(cv)){ reject(new Error('blank')); return; }
        resolve(cv);
      }catch(e){ reject(e); }
    };
    img.onerror = function(){ clearTimeout(to); reject(new Error('svg load')); };
    img.src = url;
  });
}

async function sheetToCanvasFallback(sheet, scale){
  await loadH2C();
  var r = sheet.getBoundingClientRect();
  return window.html2canvas(sheet, {
    scale:scale, backgroundColor:'#ffffff', useCORS:true, logging:false,
    imageTimeout:0, removeContainer:true, foreignObjectRendering:false,
    width:Math.round(r.width), height:Math.round(r.height),
    scrollX:0, scrollY:0, x:0, y:0,
    onclone:function(cdoc){
      var st=cdoc.createElement('style');
      st.textContent='*{animation:none!important;transition:none!important;letter-spacing:normal!important}';
      (cdoc.head||cdoc.documentElement).appendChild(st);
    }
  });
}

/* ---------- isolated render frame (used by the PDF export) ----------
   The sheets are laid out in their own document, with only the CV
   stylesheet loaded, so the export is pixel-identical to the printed
   page and never inherits anything from the site around it. */
function cvFrameDoc(L){
  var d = DATA[L];
  return '<!doctype html><html lang="'+L+'" dir="'+d.dir+'"><head><meta charset="utf-8">'
   + '<style>'+FONT_CSS+CV_CSS
   + 'html,body{margin:0;padding:0;background:#fff;overflow:hidden}'
   + '#cvStage{width:210mm;display:block}'
   + '.sheet+.sheet{margin-top:0}'
   + '</style></head><body><div id="cvStage" dir="'+d.dir+'">'
   + pipeHTML(cvSheets(L))
   + '</div></body></html>';
}

async function cvFrame(L){
  var f = document.createElement('iframe');
  f.setAttribute('aria-hidden','true');
  f.style.cssText = 'position:fixed;top:0;left:-12000px;width:250mm;height:700mm;'
                  + 'border:0;opacity:0;pointer-events:none;background:#fff';
  document.body.appendChild(f);
  var doc = f.contentDocument || f.contentWindow.document;
  doc.open(); doc.write(cvFrameDoc(L)); doc.close();
  await frame();
  try{ if(doc.fonts && doc.fonts.ready) await doc.fonts.ready; }catch(e){}
  var imgs = doc.images || [];
  for(var i=0;i<imgs.length;i++){
    if(!imgs[i].complete){
      await new Promise(function(r){ imgs[i].onload=imgs[i].onerror=r; setTimeout(r,1500); });
    }
  }
  await frame();
  autofit(doc.getElementById('cvStage'));
  await frame();
  return f;
}

/* ---------- standalone document (new tab · real text, real print) ---------- */
function cvDocument(L, autoPrint){
  var d = DATA[L], x = d.cv;
  return '<!doctype html><html lang="'+L+'" dir="'+d.dir+'">'
   + '<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
   + '<title>'+esc(d.brand.name+' · '+x.title)+'</title>'
   + '<style>'+FONT_CSS+CV_CSS
   + 'html,body{margin:0;background:#0A1E26}'
   + '#cvStage{display:flex;flex-direction:column;align-items:center;padding:26px 12px 90px}'
   + '.sheet{box-shadow:0 26px 60px rgba(0,0,0,.5)}'
   + '.tb{position:fixed;inset-inline:0;bottom:0;z-index:9;display:flex;justify-content:center;gap:10px;'
   +   'padding:12px;background:linear-gradient(to top,rgba(10,30,38,.96),rgba(10,30,38,0))}'
   + '.tb button{font-family:inherit;font-size:14px;font-weight:700;padding:11px 22px;border:none;border-radius:999px;'
   +   'cursor:pointer;background:#D2B278;color:#0A1E26;box-shadow:0 12px 28px rgba(0,0,0,.4)}'
   + '.tb button.g{background:transparent;color:#F4F8F8;border:1px solid rgba(244,248,248,.32)}'
   + '@page{size:A4;margin:0}'
   + '@media print{html,body{background:#fff}#cvStage{padding:0;display:block}'
   +   '.sheet{box-shadow:none;margin:0!important;break-after:page;page-break-after:always}'
   +   '.sheet:last-child{break-after:auto;page-break-after:auto}.tb{display:none}}'
   + '</style></head><body>'
   + '<div id="cvStage" dir="'+d.dir+'">'+pipeHTML(cvSheets(L))+'</div>'
   + '<div class="tb"><button onclick="print()">'+esc(x.tbPrint)+'</button>'
   +   '<button class="g" onclick="window.close()">'+esc(x.close)+'</button></div>'
   + '<script>'
   + '(function(){function fit(){var s=document.querySelectorAll(".sheet-in");'
   + 'for(var i=0;i<s.length;i++){var f=s[i].firstElementChild,a=s[i].clientHeight,lo=.62,hi=1.12,bt=.62,m,t;'
   + 'for(t=0;t<9;t++){m=(lo+hi)/2;f.style.transform="scale("+m+")";f.style.width=(100/m)+"%";'
   + 'if(f.scrollHeight*m<=a){bt=m;lo=m;}else{hi=m;}}'
   + 'f.style.transform="scale("+bt+")";f.style.width=(100/bt)+"%";}}'
   + 'function go(){fit();' + (autoPrint ? 'setTimeout(function(){window.print();},400);' : '') + '}'
   + 'if(document.fonts&&document.fonts.ready){document.fonts.ready.then(go);setTimeout(go,2500);}else{setTimeout(go,300);}'
   + '})();'
   + '<\/script></body></html>';
}

var docURLs = {};
function cvOpen(L, autoPrint){
  var key = L+(autoPrint?'-p':'');
  if(!docURLs[key]){
    docURLs[key] = URL.createObjectURL(new Blob([cvDocument(L,autoPrint)], {type:'text/html;charset=utf-8'}));
  }
  var w = window.open(docURLs[key], '_blank', 'noopener');
  if(!w) toast(DATA[L].cv.popup);
}

/* =====================================================================
   PDF EXPORT (rasterised A4, one click, no dialog)
   ===================================================================== */
var LIB = {
  h2c:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
};
function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src=src; s.async=true; s.onload=res; s.onerror=function(){ rej(new Error(src)); };
    document.head.appendChild(s);
  });
}
async function loadLibs(){
  if(!(window.jspdf && window.jspdf.jsPDF)) await loadScript(LIB.pdf);
  if(!window.jspdf) throw new Error('libs');
}
async function loadH2C(){
  if(!window.html2canvas) await loadScript(LIB.h2c);
  if(!window.html2canvas) throw new Error('libs');
}

/* modal + progress */
function modal(html){
  $('modalBox').innerHTML = html;
  pipeify($('modalBox'));
  $('mscrim').classList.add('open');
}
function closeModal(){ $('mscrim').classList.remove('open'); }
window.raCloseModal = closeModal;

var toastT;
function toast(msg){
  var el=$('toast'); el.textContent=msg; pipeify(el); el.classList.add('open');
  clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove('open'); },2600);
}
function progressUI(x){
  modal('<div class="ring"><svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="19"/>'
   + '<circle class="fg" id="ringFg" cx="22" cy="22" r="19" stroke-dasharray="119.4" stroke-dashoffset="119.4"/></svg>'
   + '<b id="ringPct">0%</b></div>'
   + '<h4>'+esc(x.building)+'</h4><p class="sub">'+esc(x.buildingSub)+'</p>'
   + '<div class="step" id="ringStep"></div>');
}
function progress(p, step){
  var fg=$('ringFg'); if(fg) fg.style.strokeDashoffset = (119.4*(1-p)).toFixed(1);
  var pc=$('ringPct'); if(pc) pc.textContent = Math.round(p*100)+'%';
  var st=$('ringStep'); if(st && step) st.textContent = step;
}

var busy=false, lastFile=null;
async function cvPdf(L){
  if(busy) return;
  busy = true;
  var d = DATA[L], x = d.cv;
  progressUI(x);
  await frame();

  var fr = null;
  try{
    if(document.fonts && document.fonts.ready){ await document.fonts.ready; }

    progress(.08, x.s1);
    fr = await cvFrame(L);
    var fdoc = fr.contentDocument;
    progress(.16, x.s2);
    await loadLibs();

    var sheets = fdoc.querySelectorAll('.sheet');
    var total = sheets.length;
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});

    /* ~300 dpi on a 210mm sheet; lighter where memory is tight */
    var lowMem = (navigator.deviceMemory && navigator.deviceMemory <= 4)
              || (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && !window.matchMedia('(min-width:900px)').matches);
    var scale = lowMem ? 2.2 : 3;

    for(var i=0;i<total;i++){
      var canvas;
      try{
        canvas = await sheetToCanvasSVG(sheets[i], fdoc, scale);
      }catch(e){
        canvas = await sheetToCanvasFallback(sheets[i], scale);
      }
      if(i>0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg',0.97), 'JPEG', 0, 0, 210, 297, 'p'+i, 'SLOW');
      canvas.width = canvas.height = 0;
      progress(.22 + .72*((i+1)/total), x.s3.replace('%1',i+1).replace('%2',total));
      await frame();
    }

    progress(.98, x.s4);
    await frame();
    try{ if(pdf.setLanguage) pdf.setLanguage(L==='ar'?'ar-SA':'en'); }catch(e){}
    pdf.setProperties({
      title: d.brand.name+' · '+x.title,
      subject: d.hero.role,
      author: d.brand.name,
      keywords:'Technical Office Engineer, Structural, PMP, Tekla, Revit, AutoCAD',
      creator:'raad-asiri'
    });
    var name = x.file+'-'+REV+'.pdf';
    var blob = pdf.output('blob');
    lastFile = {blob:blob, name:name, url:URL.createObjectURL(blob), size:blob.size, L:L};
    pdf.save(name);
    doneUI(L);
  }catch(err){
    console.error(err);
    closeModal();
    toast(x.failed);
    cvOpen(L, true);
  }finally{
    if(fr && fr.parentNode) fr.parentNode.removeChild(fr);
    busy = false;
  }
}

function kb(n){ return n>1048576 ? (n/1048576).toFixed(1)+' MB' : Math.round(n/1024)+' KB'; }
function doneUI(L){
  var d=DATA[L], x=d.cv, url=pageURL();
  modal('<div class="doneic">'+I.check+'</div>'
   + '<h4>'+esc(x.done)+'</h4><p class="sub">'+esc(x.doneSub)+'</p>'
   + '<div class="sharegrid">'
   +   '<button class="sbtn wa" data-s="wa" data-l="'+L+'">'+I.wa+'<span>'+esc(x.wa)+'</span></button>'
   +   '<button class="sbtn" data-s="mail" data-l="'+L+'">'+I.mail+'<span>'+esc(x.email)+'</span></button>'
   +   (url?'<button class="sbtn" data-s="copy" data-l="'+L+'">'+I.link+'<span>'+esc(x.copy)+'</span></button>':'')
   +   '<button class="sbtn" data-s="open" data-l="'+L+'">'+I.eye+'<span>'+esc(x.view)+'</span></button>'
   + '</div>'
   + '<button class="mclose" onclick="raCloseModal()">'+esc(x.close)+'</button>');
}
$('modalBox').addEventListener('click', function(e){
  var b = e.target.closest('button[data-s]'); if(!b) return;
  var L = b.getAttribute('data-l'), x = DATA[L].cv, url = pageURL();
  var s = b.getAttribute('data-s');
  if(s==='wa')   window.open('https://wa.me/?text='+encodeURIComponent(x.waMsg+(url?'\n'+url:'')),'_blank','noopener');
  if(s==='mail') window.open('mailto:?subject='+encodeURIComponent(x.mailSubject)+'&body='+encodeURIComponent(x.mailBody+(url?'\n\n'+url:'')),'_self');
  if(s==='copy'){ (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject())
                    .then(function(){ toast(x.copied); },function(){ toast(x.copied); }); }
  if(s==='open'){ closeModal(); cvOpen(L,false); }
});
$('mscrim').addEventListener('click', function(e){ if(e.target===$('mscrim')) closeModal(); });

window.RaadCV = { open:cvOpen, pdf:cvPdf, doc:cvDocument, sheets:cvSheets };

render();
})();
